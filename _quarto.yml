title: The role of cognateness in native spoken word recognition
shorttitle: Cognateness and recognition of foreign words

abstract: |
  Homophonic translation is a popular perceptual phenomenon by which non-native speech activates words or phrases in a listener's native language. In this study, we characterise homophonic translation from a language processing perspective for the first time. Across three studies, English and Spanish-native monolingual adults completed a translation el
  icitation task in which participants listened to words in an unfamiliar language (Catalan or Spanish), and were asked to type their best-guess translation in their native language. Our findings suggest that that listening to speech in an unfamiliar language triggers equivalent dynamics of lexical selection than native speech. In particular, phonological similarity between the presented words and their correct translations interacted with phonological neighbourhood density: participants correctly translated words with high phonological similarity with their correct translation only when few other words in the native language shared phonological similarity with the presented word.

impact-statement: |
  We provide the first language processing account of homophonic translation. Auditory speech in an unfamiliar language engages similar dynamics of lexical activation and selection as native speech comprehension. Listeners of speech in an unfamiliar language show a remarkable ability to exploit phonological simlarity to provide correct word translations in their native language.

