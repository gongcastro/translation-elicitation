    - docs/manuscript.qmd
    - docs/appendix.qmd

format:
  apaquarto-typst: default
  # apaquarto-pdf: default
  apaquarto-docx: default

title: The role of cognateness in native spoken word recognition
shorttitle: Cognateness and recognition of foreign words
keywords:
  - spoken word recognition
  - phonology
  - cognateness
  - language processing
  - nonnative speech
  - lexical processing

floatsintext: true
numbered-lines: true
mask: false
suppress-title-page: true
word-count: true
knitr:
  opts_chunk:
    fig.path: img/

author-note:
  disclosures:
    data-sharing: |
      All materials, data, and code used in this study are hosted in the Open Science Framework [https://osf.io/9fjxm](https://osf.io/9fjxm) and a GitHub repository [https://github.com/gongcastro/translation-elicitation.git](https://github.com/gongcastro/translation-elicitation.git), along with additional notes. For reproducibility, a Docker image of the RStudio session is available on DockerHub ([https://hub.docker.com/repository/docker/gongcastro/translation-elicitation/general](https://hub.docker.com/repository/docker/gongcastro/translation-elicitation/general)).
    financial-support: |
      This study was supported by the Spanish Ministry for Science and Innovation and State Research Agency (Project PGC2018-101831-B-I00 financed by Spanish Ministry of Science Innovation and Universities (MCIU), Spanish Research Agency (AEI) and the European Regional Development Fund (ERDF), and by the Economic and Social Research Council (ESRC) (ES/S010947/1, UK). GGC was supported by a FPI research contract (PRE2019-088165). NSG was supported by grants from Spanish Ministry (Project PID2024-155658NB-I00 LADIBIS (Effects of language distance in bilinguals speech perception) financed by MICIU/AEI/10.13039/501100011033/FEDER, UE, the Catalan Government (SGR 2021–00911) and from Institució Catalana de Recerca i Estudis Avançats (ICREA Acadèmia 2023).
    conflict-of-interest: |
      The authors declare no conflicts of interest with regard to the funding source of this study.
    gratitude: |
      We are grateful to Irina Lepadatu and Nicola Gillen, and to the Speech Acquisition and Perception research group for their helpful feedback. We thank Xavier Mayoral, Silvia Blanch, Pamela Miller, and Cristina Cuadrado for their technical support. We also thank all participants who took part in the experiments.


